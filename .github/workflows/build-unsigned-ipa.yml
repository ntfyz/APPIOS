name: Build Unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Check available schemes
        run: xcodebuild -list -project BasicButtonApp.xcodeproj

      - name: Build app without code signing
        run: |
          xcodebuild build \
            -project BasicButtonApp.xcodeproj \
            -scheme BasicButtonApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          APP_DIR="build/DerivedData/Build/Products/Release-iphoneos/BasicButtonApp.app"
          if [ ! -d "$APP_DIR" ]; then
            echo "ERROR: App bundle not found at $APP_DIR"
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_DIR" build/ipa/Payload/
          cd build/ipa
          zip -r BasicButtonApp-unsigned.ipa Payload
          rm -rf Payload

      - name: List IPA output
        run: ls -la build/ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BasicButtonApp-Unsigned-IPA
          path: build/ipa/BasicButtonApp-unsigned.ipa
          if-no-files-found: error